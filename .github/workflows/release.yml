name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'installer/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Read version
        id: version
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'tide').version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match Cargo.toml version v$version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: cargo build --release --locked
      - name: Package Tide
        env:
          TIDE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc "/DVersion=$env:TIDE_VERSION" installer/tide.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/release/tide.exe "dist/Tide-$env:TIDE_VERSION-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: tide-windows
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TIDE_VERSION: ${{ steps.version.outputs.version }}
        run: gh release create $env:GITHUB_REF_NAME 'dist/*' --title "Tide $env:TIDE_VERSION" --generate-notes --verify-tag
